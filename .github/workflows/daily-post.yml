name: Daily Nasuha Content Package

on:
  schedule:
    # Daily at 06:00 WIB (23:00 UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily content package
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_daily_content.py

      - name: Generate premium AI background
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-1
        run: python scripts/generate_ai_background.py

      - name: Render poster
        run: python scripts/render_poster.py

      - name: Upload ready-to-review content
        uses: actions/upload-artifact@v4
        with:
          name: nasuha-daily-content-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
