name: Daily Nasuha Post

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_daily_content.py

      - name: Render poster
        run: python scripts/render_poster.py

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p public
          cp output/poster.png public/poster.png

      - name: Deploy poster to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public

      - name: Wait for GitHub Pages
        run: |
          URL="https://nasuha-life.github.io/nasuha-automation/poster.png"
          echo "Waiting for GitHub Pages..."
          for i in {1..24}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "GitHub Pages ready."
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not become available in time."
          exit 1

      - name: Publish to Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        run: python scripts/post_to_meta.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasuha-output
          path: |
            output/poster.png
            output/post_log.json
            output/output.json
