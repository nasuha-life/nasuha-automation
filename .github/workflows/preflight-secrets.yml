name: Nasuha Secrets Preflight (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret presence without printing values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          names = ["OPENAI_API_KEY", "META_ACCESS_TOKEN", "FB_PAGE_ID", "IG_BUSINESS_ID"]
          missing = [name for name in names if not os.getenv(name, "").strip()]
          if missing:
              print("MISSING_SECRETS: " + ", ".join(missing))
              sys.exit(1)
          print("SECRET_PRESENCE: all four required secrets are present (values hidden)")

          def get_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  try:
                      body = json.loads(exc.read().decode("utf-8"))
                  except Exception:
                      body = {}
                  error = body.get("error", {}) if isinstance(body, dict) else {}
                  # Deliberately do not print response messages or token values.
                  return exc.code, {"error_type": error.get("type"), "error_code": error.get("code"), "error_subcode": error.get("error_subcode")}
              except Exception as exc:
                  return 0, {"error_type": type(exc).__name__}

          failed = False
          status, _ = get_json(
              "https://api.openai.com/v1/models",
              {"Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]}
          )
          print("OPENAI_AUTH: " + ("PASS" if status == 200 else f"FAIL (HTTP {status})"))
          failed |= status != 200

          token = urllib.parse.quote(os.environ["META_ACCESS_TOKEN"], safe="")
          base = "https://graph.facebook.com/v25.0/"
          status, me = get_json(base + "me?fields=id,name&access_token=" + token)
          me_ok = status == 200 and isinstance(me, dict) and bool(me.get("id"))
          print("META_TOKEN: " + ("PASS" if me_ok else f"FAIL (HTTP {status}; code={me.get('error_code') if isinstance(me, dict) else 'unknown'})"))
          failed |= not me_ok

          page_id = urllib.parse.quote(os.environ["FB_PAGE_ID"], safe="")
          status, page = get_json(base + page_id + "?fields=id,name,instagram_business_account&access_token=" + token)
          page_ok = status == 200 and isinstance(page, dict) and str(page.get("id")) == os.environ["FB_PAGE_ID"]
          print("FB_PAGE_ACCESS: " + ("PASS" if page_ok else f"FAIL (HTTP {status}; code={page.get('error_code') if isinstance(page, dict) else 'unknown'})"))
          failed |= not page_ok

          linked_ig = page.get("instagram_business_account", {}).get("id") if page_ok and isinstance(page.get("instagram_business_account"), dict) else None
          expected_ig = os.environ["IG_BUSINESS_ID"]
          if linked_ig:
              print("IG_PAGE_LINK: " + ("PASS" if str(linked_ig) == expected_ig else "FAIL (configured IG_BUSINESS_ID does not match linked account)"))
              failed |= str(linked_ig) != expected_ig
          else:
              print("IG_PAGE_LINK: FAIL (no instagram_business_account returned for this Page/token)")
              failed = True

          ig_id = urllib.parse.quote(expected_ig, safe="")
          status, ig = get_json(base + ig_id + "?fields=id,username,account_type&access_token=" + token)
          ig_ok = status == 200 and isinstance(ig, dict) and str(ig.get("id")) == expected_ig
          print("IG_ACCOUNT_ACCESS: " + ("PASS" if ig_ok else f"FAIL (HTTP {status}; code={ig.get('error_code') if isinstance(ig, dict) else 'unknown'})"))
          failed |= not ig_ok

          if failed:
              print("PREFLIGHT_RESULT: FAIL — no content was posted. Review secret values/permissions privately in GitHub and Meta.")
              sys.exit(1)
          print("PREFLIGHT_RESULT: PASS — authentication and Page/Instagram linkage checks passed. No content was posted.")
          PY
