<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasuha Daily Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #0f203e 0%, #1a2e4d 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .poster::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(90deg, #22b14c 0%, #1a9940 100%);
            z-index: 1;
        }
        
        .poster > * {
            position: relative;
            z-index: 2;
        }
        
        .header {
            margin-top: 40px;
        }
        
        .title {
            font-size: 48px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .verse-reference {
            font-size: 32px;
            color: #22b14c;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .verse {
            font-size: 24px;
            line-height: 1.8;
            color: #dcdcdc;
            margin-bottom: 40px;
            font-style: italic;
            border-left: 4px solid #22b14c;
            padding-left: 20px;
        }
        
        .reflection {
            font-size: 24px;
            line-height: 1.8;
            margin-bottom: 40px;
            text-align: justify;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            background: #22b14c;
            border-radius: 10px;
            margin-top: 40px;
        }
        
        .branding {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        
        .caption {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
            margin-top: 20px;
        }
        
        .divider {
            width: 100px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            margin: 20px auto;
        }
        
        @media (max-width: 1200px) {
            .poster {
                width: 100%;
                height: auto;
                padding: 40px 30px;
            }
            
            .title {
                font-size: 36px;
            }
            
            .verse {
                font-size: 18px;
            }
            
            .reflection {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="header">
            <h1 class="title">{{ title }}</h1>
        </div>
        
        <div class="content">
            <div class="verse-reference">{{ verse_reference }}</div>
            <div class="verse">{{ verse }}</div>
            <div class="reflection">{{ reflection }}</div>
        </div>
        
        <div class="footer">
            <div class="branding">nasuha.life</div>
            <div class="divider"></div>
            <div class="caption">{{ caption }}</div>
        </div>
    </div>
</body>
</html>
